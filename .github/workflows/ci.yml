name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e './backend[dev]'
      - run: ruff check backend
      - run: pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend, containers]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start complete stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Exercise proxy, workspace isolation and document lifecycle
        run: python tests/integration/smoke.py
      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color > integration-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-logs
          path: integration-logs.txt
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
